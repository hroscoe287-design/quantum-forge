services:
  - type: web
    name: quantum-forge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FORGE_CYCLE_SECONDS
        value: "300"
      - key: FORGE_PROJECTS_PER_CYCLE
        value: "1"
      - key: OPENAI_MODEL
        value: "gpt-5-mini"
      - key: OPENAI_API_KEY
        sync: false
      - key: QUANTUM_HARDWARE_ENABLED
        value: "false"
      - key: QUANTUM_PROVIDER
        value: "ibm"
      - key: IBM_QUANTUM_BACKEND
        value: "ibm_brisbane"
      - key: QUANTUM_SHOTS
        value: "128"
